<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64" role="img" aria-labelledby="logo-title logo-desc">
  <title id="logo-title">阿里孩舞</title>
  <desc id="logo-desc">银色神经网络节点组成字母 A，两个香槟金核心节点象征 AI 与代码。</desc>
  <defs>
    <radialGradient id="logo-bg" cx="50%" cy="38%" r="72%">
      <stop offset="0" stop-color="#34352f"/>
      <stop offset=".48" stop-color="#1b1d1c"/>
      <stop offset="1" stop-color="#0d0f0f"/>
    </radialGradient>
    <linearGradient id="logo-silver" x1="12" y1="10" x2="52" y2="52" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#f3f4ef"/>
      <stop offset=".52" stop-color="#c9cac5"/>
      <stop offset="1" stop-color="#7d817c"/>
    </linearGradient>
    <linearGradient id="logo-gold" x1="28" y1="12" x2="37" y2="39" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fff4d6"/>
      <stop offset=".55" stop-color="#ecd9a6"/>
      <stop offset="1" stop-color="#d7b979"/>
    </linearGradient>
    <filter id="logo-glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="1.25" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="64" height="64" rx="17" fill="#0d0e0e"/>
  <rect x="1.75" y="1.75" width="60.5" height="60.5" rx="15.25" fill="url(#logo-bg)" stroke="url(#logo-silver)" stroke-opacity=".48" stroke-width="1.5"/>
  <path d="M32 7 52 18.5v23L32 53 12 41.5v-23Z" fill="none" stroke="url(#logo-silver)" stroke-opacity=".48" stroke-width="1.25" stroke-linejoin="round"/>

  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M32 16V7M18 45l-6-3.5M46 45l6-3.5" stroke="#c9cac5" stroke-opacity=".65" stroke-width="1.25"/>
    <path d="m18 45 14-29 14 29M23.5 34h17" stroke="url(#logo-silver)" stroke-width="2.25"/>
  </g>

  <g fill="#e6e7e3">
    <circle cx="18" cy="45" r="3"/>
    <circle cx="46" cy="45" r="3"/>
    <circle cx="23.5" cy="34" r="2.25"/>
    <circle cx="40.5" cy="34" r="2.25"/>
    <circle cx="12" cy="41.5" r="1.75"/>
    <circle cx="52" cy="41.5" r="1.75"/>
    <circle cx="32" cy="7" r="1.75"/>
  </g>
  <g fill="url(#logo-gold)" filter="url(#logo-glow)">
    <circle cx="32" cy="16" r="4"/>
    <circle cx="32" cy="34" r="3.25"/>
  </g>
</svg>
