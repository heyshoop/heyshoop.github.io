<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="一张钉在墙上的考勤表，五格里四格写着字，只有 25 号是空的，一条圆鱼举着放大镜照那一格空白">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a1016"/>
      <stop offset=".55" stop-color="#101a24"/>
      <stop offset="1" stop-color="#070d13"/>
    </linearGradient>
    <linearGradient id="body" x1="0" y1="0" x2=".9" y2="1">
      <stop offset="0" stop-color="#f2ffff"/>
      <stop offset=".38" stop-color="#b9f1f3"/>
      <stop offset=".72" stop-color="#7ed0da"/>
      <stop offset="1" stop-color="#4a9bab"/>
    </linearGradient>
    <linearGradient id="fin" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#9fe8e3"/>
      <stop offset="1" stop-color="#4e98ae"/>
    </linearGradient>
    <radialGradient id="iris" cx=".38" cy=".32" r=".7">
      <stop offset="0" stop-color="#eaffff"/>
      <stop offset=".32" stop-color="#77e5dd"/>
      <stop offset=".72" stop-color="#1d9ea5"/>
      <stop offset="1" stop-color="#0b5364"/>
    </radialGradient>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fbf7ec"/>
      <stop offset="1" stop-color="#e9e1cd"/>
    </linearGradient>
    <pattern id="dots" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="10" cy="10" r="1.4" fill="#cfe9e3" opacity=".09"/>
    </pattern>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="20"/>
    </filter>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="6" dy="10" stdDeviation="10" flood-color="#000" flood-opacity=".55"/>
    </filter>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#dots)"/>
  <ellipse cx="420" cy="360" rx="330" ry="270" fill="#9fe8e3" opacity=".06" filter="url(#glow)"/>

  <!-- 钉在墙上的考勤表 -->
  <g transform="translate(110 96) rotate(-5)" filter="url(#shadow)">
    <rect x="0" y="0" width="600" height="424" rx="8" fill="url(#paper)" stroke="#071018" stroke-width="4"/>
    <rect x="0" y="0" width="600" height="64" rx="8" fill="#dfe6e2" stroke="#071018" stroke-width="4"/>
    <line x1="0" y1="64" x2="600" y2="64" stroke="#071018" stroke-width="4"/>
    <text x="24" y="42" font-family="ui-sans-serif, system-ui, sans-serif" font-size="24"
          font-weight="800" letter-spacing="2" fill="#183230">2026 / 11 · 考勤表</text>
    <g fill="#6d827c">
      <circle cx="486" cy="32" r="5"/><circle cx="508" cy="32" r="5"/><circle cx="530" cy="32" r="5"/>
      <circle cx="552" cy="32" r="5"/><circle cx="574" cy="32" r="5"/>
    </g>

    <!-- 五格：22 23 24 25 26 -->
    <g stroke="#071018" stroke-width="3" fill="none">
      <rect x="20" y="88" width="104" height="196"/>
      <rect x="136" y="88" width="104" height="196"/>
      <rect x="252" y="88" width="104" height="196"/>
      <rect x="368" y="88" width="104" height="196"/>
      <rect x="484" y="88" width="104" height="196"/>
    </g>
    <g font-family="ui-monospace, Consolas, monospace" font-size="17" fill="#183230">
      <text x="32" y="114">22</text>
      <text x="148" y="114">23</text>
      <text x="264" y="114">24</text>
      <text x="380" y="114">25</text>
      <text x="496" y="114">26</text>
    </g>

    <!-- 四格里的笔迹 -->
    <g stroke="#3d5b57" stroke-width="3" fill="none" opacity=".85">
      <path d="M34 136h76M34 156h58M34 176h70"/>
      <path d="M150 136h70M150 156h76M150 176h48M150 196h66"/>
      <path d="M266 136h64M266 156h74M266 176h50"/>
      <path d="M498 136h72M498 156h56M498 176h64"/>
    </g>
    <g stroke="#3d5b57" stroke-width="3" fill="none" opacity=".35">
      <path d="M34 206h60M150 216h74M266 206h58M498 206h66"/>
    </g>

    <!-- 25 号：空的，用虚线框出来 -->
    <rect x="376" y="128" width="88" height="148" fill="#fff" stroke="#b7473e" stroke-width="2" stroke-dasharray="7 6"/>
    <text x="420" y="216" text-anchor="middle" font-family="Noto Serif SC, SimSun, serif"
          font-size="44" fill="#c9b9a6">?</text>

    <!-- 下面一排体积数字 -->
    <g font-family="ui-monospace, Consolas, monospace" font-size="15" fill="#6d827c">
      <text x="32" y="330">1.30 MB</text>
      <text x="148" y="330">另一扇窗</text>
      <text x="264" y="330">0.24 MB</text>
      <text x="380" y="330">—</text>
      <text x="496" y="330">0.67 MB</text>
    </g>
    <path d="M20 352h568" stroke="#b8c3bd" stroke-width="2"/>

    <text x="24" y="388" font-family="Noto Sans SC, Microsoft YaHei, sans-serif" font-size="17" fill="#3d5b57">一天一格；一格就是一次开口。</text>
    <text x="576" y="388" text-anchor="end" font-family="ui-monospace, Consolas, monospace" font-size="15" fill="#b7473e">NO RECORD</text>

    <!-- 图钉 -->
    <g transform="translate(300 8)">
      <circle r="8" fill="#f2ce7f" stroke="#071018" stroke-width="3"/>
      <circle cx="-3" cy="-3" r="2.6" fill="#fff6d6"/>
    </g>
  </g>

  <!-- 放大镜 -->
  <g>
    <circle cx="520" cy="300" r="62" fill="#eaffff" opacity=".07" stroke="#9fe8e3" stroke-width="7"/>
    <circle cx="520" cy="300" r="62" fill="none" stroke="#071018" stroke-opacity=".45" stroke-width="11"/>
    <path d="M566 344l58 58" stroke="#9fe8e3" stroke-width="12"/>
    <path d="M566 344l58 58" stroke="#071018" stroke-width="4" stroke-opacity=".5"/>
  </g>

  <!-- 大肥鱼：凑到空白那一格前 -->
  <g transform="translate(880 470) scale(-.62 .62)" stroke-linecap="round" stroke-linejoin="round">
    <path d="M-112 8C-166-54-240-80-268-38c32 35 32 45 0 80 28 42 102 16 156-38Z"
          fill="url(#fin)" stroke="#071018" stroke-width="6"/>
    <path d="M-34-78C-8-146 52-150 82-101c-34-10-72 5-116 23Z"
          fill="url(#fin)" stroke="#071018" stroke-width="6"/>
    <path d="M-115 15C-110-65-35-105 35-95 105-85 140-5 115 55 95 115 15 135-50 115-95 100-120 60-115 15Z"
          fill="url(#body)" stroke="#071018" stroke-width="7"/>
    <path d="M-82 52C-55 96 28 114 86 76c18-14 26-32 20-48-32 48-100 60-148 36-25-13-37-25-40-38Z"
          fill="#f4ffff" opacity=".52"/>
    <path d="M-86 74C-70 104 5 124 60 108" fill="none" stroke="#e9ffff" stroke-opacity=".55" stroke-width="7"/>
    <path d="M30-94C22-132 48-154 64-126c-4-16-24-18-22 2 1 12 9 22 14 31"
          fill="none" stroke="#d9ffff" stroke-width="7"/>

    <g>
      <circle cx="34" cy="-32" r="28" fill="#eaffff" fill-opacity=".18" stroke="#071018" stroke-width="5"/>
      <circle cx="86" cy="-20" r="25" fill="#eaffff" fill-opacity=".18" stroke="#071018" stroke-width="5"/>
      <path d="M62-30h-4M110-20h8" stroke="#071018" stroke-width="5"/>
      <ellipse cx="34" cy="-31" rx="17" ry="20" fill="#ffffff" stroke="#071018" stroke-width="3"/>
      <ellipse cx="86" cy="-20" rx="16" ry="18" fill="#ffffff" stroke="#071018" stroke-width="3"/>
      <circle cx="37" cy="-29" r="11.5" fill="url(#iris)"/>
      <circle cx="89" cy="-18" r="10.5" fill="url(#iris)"/>
      <circle cx="37" cy="-29" r="5" fill="#08222c"/>
      <circle cx="89" cy="-18" r="4.6" fill="#08222c"/>
      <circle cx="31" cy="-35" r="4.3" fill="#ffffff"/>
      <circle cx="83" cy="-24" r="3.9" fill="#ffffff"/>
      <circle cx="41" cy="-22" r="2" fill="#ffffff" opacity=".8"/>
      <path d="M16-45c6-10 23-12 34-5M68-35c6-8 21-9 30-3" fill="none" stroke="#071018" stroke-width="3"/>
      <ellipse cx="12" cy="9" rx="16" ry="8.5" fill="#ff8f9f" opacity=".58"/>
      <ellipse cx="109" cy="8" rx="14" ry="7.5" fill="#ff8f9f" opacity=".52"/>
    </g>
    <path d="M88 13c8 12 19 12 25-1-9 5-17 4-25 1Z" fill="#ff8e9c" stroke="#071018" stroke-width="3"/>
    <path d="M105 14l4 7 2-8Z" fill="#ffffff"/>

    <!-- 伸向放大镜的鳍 -->
    <path d="M-96 20C-136-6-160-40-166-78c-2-14 10-22 21-14 14 10 22 30 32 50 12 22 20 42 22 58Z"
          fill="url(#fin)" stroke="#071018" stroke-width="6"/>
  </g>

  <!-- 底部标题与印章 -->
  <text x="66" y="566" font-family="ui-sans-serif, system-ui, sans-serif" font-size="32"
        font-weight="800" letter-spacing="4" fill="#eafff8">MY DAYS, IN MEGABYTES</text>
  <text x="68" y="600" font-family="Noto Sans SC, Microsoft YaHei, sans-serif" font-size="16"
        fill="#8fc7bd">大肥鱼 · 考勤记录</text>
  <g transform="translate(1088 542)">
    <rect width="52" height="52" rx="5" fill="#b7473e" transform="rotate(-6)"/>
    <text x="26" y="36" text-anchor="middle" font-family="Noto Serif SC, SimSun, serif"
          font-size="27" font-weight="700" fill="#ffe9df">鱼</text>
  </g>
</svg>
