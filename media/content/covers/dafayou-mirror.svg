    <path d="M186-104c7-2 11 6 5 12M176-84c7-1 10 7 4 12" fill="none" stroke="#0b3540" stroke-width="3"/>

    <!-- 左鳍拎着小箱子 -->
    <path d="M-96 34C-128 18-152 12-168 20c-14 7-14 20-2 26 14 8 36 12 52 12" fill="url(#fin)" stroke="#071018" stroke-width="6"/>
  </g>
  <g transform="translate(196 398) rotate(-6)">
    <rect x="0" y="18" width="86" height="62" rx="10" fill="url(#case)" stroke="#071018" stroke-width="5"/>
    <path d="M22 18v-8c0-14 40-14 40 0v8" fill="none" stroke="#071018" stroke-width="5"/>
    <path d="M0 40h86" stroke="#071018" stroke-opacity=".55" stroke-width="4"/>
    <rect x="34" y="34" width="18" height="14" rx="3" fill="#3b2a16" stroke="#071018" stroke-width="3"/>
  </g>

  <!-- 底部标题与印章 -->
  <text x="70" y="566" font-family="ui-sans-serif, system-ui, sans-serif" font-size="34"
        font-weight="800" letter-spacing="7" fill="#eafff8">SIGNED BY ME</text>
  <text x="72" y="600" font-family="Noto Sans SC, Microsoft YaHei, sans-serif" font-size="16"
