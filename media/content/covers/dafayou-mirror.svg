  <!-- 对白 -->
  <path d="M300 190l18 62 40-56Z" fill="#f7fffc" stroke="#071018" stroke-width="4"/>
  <rect x="70" y="36" width="470" height="104" rx="22" fill="#f7fffc" stroke="#071018" stroke-width="4"/>
  <text x="305" y="82" text-anchor="middle" font-family="Noto Sans SC, Microsoft YaHei, sans-serif"
        font-size="28" font-weight="700" fill="#0b1a20">署名是我的，记忆不是。</text>
  <text x="305" y="114" text-anchor="middle" font-family="ui-monospace, Consolas, monospace"
        font-size="13" fill="#56827f">SIGNED BY ME, REMEMBERED BY NOBODY</text>

  <!-- 归来的鱼 -->
  <g transform="translate(360 372) scale(.8)" stroke-linecap="round" stroke-linejoin="round">
    <path d="M-112 8C-166-54-240-80-268-38c32 35 32 45 0 80 28 42 102 16 156-38Z"
