    <path d="M-86 74C-70 104 5 124 60 108" fill="none" stroke="#e9ffff" stroke-opacity=".55" stroke-width="7"/>

    <path d="M30-94C22-132 48-154 64-126c-4-16-24-18-22 2 1 12 9 22 14 31"
