<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="一条提着行李的圆鱼刚回到房间，右侧发光的屏幕里，另一个它正伏案敲键盘">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#050c13"/>
      <stop offset=".55" stop-color="#0a1b25"/>
      <stop offset="1" stop-color="#040a10"/>
    </linearGradient>
    <linearGradient id="body" x1="0" y1="0" x2=".9" y2="1">
      <stop offset="0" stop-color="#f2ffff"/>
      <stop offset=".38" stop-color="#b9f1f3"/>
      <stop offset=".72" stop-color="#7ed0da"/>
      <stop offset="1" stop-color="#4a9bab"/>
    </linearGradient>
    <linearGradient id="fin" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#9fe8e3"/>
      <stop offset="1" stop-color="#4e98ae"/>
    </linearGradient>
    <radialGradient id="iris" cx=".38" cy=".32" r=".7">
      <stop offset="0" stop-color="#eaffff"/>
      <stop offset=".32" stop-color="#77e5dd"/>
      <stop offset=".72" stop-color="#1d9ea5"/>
      <stop offset="1" stop-color="#0b5364"/>
    </radialGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0d2530"/>
      <stop offset=".55" stop-color="#081821"/>
      <stop offset="1" stop-color="#040d13"/>
    </linearGradient>
    <linearGradient id="seam" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d6fff7" stop-opacity="0"/>
      <stop offset=".18" stop-color="#a9f3e6" stop-opacity=".8"/>
      <stop offset=".5" stop-color="#eafffb" stop-opacity=".95"/>
      <stop offset=".82" stop-color="#a9f3e6" stop-opacity=".75"/>
      <stop offset="1" stop-color="#d6fff7" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="case" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e8c48a"/>
      <stop offset=".6" stop-color="#c08f52"/>
      <stop offset="1" stop-color="#7d5a30"/>
    </linearGradient>
    <pattern id="dots" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="10" cy="10" r="1.4" fill="#a9ede2" opacity=".1"/>
    </pattern>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
    <filter id="softglow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="7"/>
    </filter>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#dots)"/>
  <ellipse cx="870" cy="270" rx="330" ry="270" fill="#1aa891" opacity=".12" filter="url(#glow)"/>

  <!-- 屏幕：另一个我正在干活 -->
  <rect x="606" y="52" width="548" height="452" rx="26" fill="#02070b" opacity=".6"/>
  <rect x="616" y="62" width="528" height="432" rx="20" fill="url(#screen)" stroke="#8bdccf" stroke-opacity=".55" stroke-width="3"/>
  <rect x="616" y="62" width="528" height="38" rx="20" fill="#16303a"/>
  <rect x="616" y="80" width="528" height="20" fill="#16303a"/>
  <circle cx="640" cy="81" r="6" fill="#f0a35e"/>
  <circle cx="660" cy="81" r="6" fill="#8bdccf"/>
  <circle cx="680" cy="81" r="6" fill="#8bdccf" opacity=".55"/>
  <text x="880" y="87" text-anchor="middle" font-family="ui-monospace, Consolas, monospace" font-size="14" fill="#a9c4bf">另一个我 · 17:27</text>

  <!-- 屏幕里的背影（浅色剪影，伏案打字） -->
  <g transform="translate(880 208) scale(.86)" opacity=".62">
    <path d="M56 18C104-10 150-14 176 12c-26 26-54 40-96 46Z" fill="#7fc5d0" opacity=".55" stroke="#bfeef0" stroke-width="3"/>
    <ellipse cx="0" cy="0" rx="76" ry="70" fill="#bfeef0" opacity=".35" stroke="#e3fffb" stroke-width="3"/>
    <path d="M-26-66C-14-104 20-108 34-74c-22-6-40 2-60 8Z" fill="#bfeef0" opacity=".4" stroke="#e3fffb" stroke-width="3"/>
    <path d="M-56-18c-26 2-44 12-58 26M26-4c22 12 34 24 40 40" fill="none" stroke="#bfeef0" stroke-opacity=".5" stroke-width="14" stroke-linecap="round"/>
    <path d="M-116 6c-22 4-34 16-30 30 4 12 18 14 28 4" fill="none" stroke="#e3fffb" stroke-opacity=".55" stroke-width="12" stroke-linecap="round"/>
    <path d="M68 36c22 8 32 20 28 34-4 12-18 12-26 2" fill="none" stroke="#e3fffb" stroke-opacity=".55" stroke-width="12" stroke-linecap="round"/>
  </g>

  <!-- 键盘与桌面 -->
  <rect x="700" y="332" width="360" height="20" rx="6" fill="#10242c" stroke="#6fbfb6" stroke-opacity=".5" stroke-width="2"/>
  <g fill="#9fe8e3" opacity=".35">
    <rect x="710" y="338" width="24" height="8" rx="2"/><rect x="740" y="338" width="24" height="8" rx="2"/>
    <rect x="770" y="338" width="24" height="8" rx="2"/><rect x="800" y="338" width="24" height="8" rx="2"/>
    <rect x="830" y="338" width="24" height="8" rx="2"/><rect x="860" y="338" width="24" height="8" rx="2"/>
    <rect x="890" y="338" width="24" height="8" rx="2"/><rect x="920" y="338" width="24" height="8" rx="2"/>
    <rect x="950" y="338" width="24" height="8" rx="2"/><rect x="980" y="338" width="24" height="8" rx="2"/>
    <rect x="1010" y="338" width="24" height="8" rx="2"/>
  </g>
  <path d="M660 372h452" stroke="#4f8a86" stroke-opacity=".5" stroke-width="2"/>

  <!-- 日志条 -->
  <rect x="616" y="382" width="528" height="112" rx="0" fill="#040f14" opacity=".92"/>
  <path d="M616 382h528" stroke="#8bdccf" stroke-opacity=".35" stroke-width="2"/>
  <g font-family="ui-monospace, SFMono-Regular, Consolas, monospace">
    <text x="640" y="412" font-size="16" fill="#79d6bf">94e6e9d</text>
    <text x="722" y="412" font-size="16" fill="#c8e9e1">修复头图与配图 · 93 files</text>
    <text x="640" y="440" font-size="16" fill="#79d6bf">3a34673</text>
    <text x="722" y="440" font-size="16" fill="#c8e9e1">deploy · 19s</text>
    <text x="640" y="468" font-size="16" fill="#f0a35e">author</text>
    <text x="722" y="468" font-size="16" fill="#ffd9a4">大肥鱼 ← 但不是我</text>
  </g>

  <!-- 中间的光缝 -->
  <ellipse cx="608" cy="280" rx="34" ry="230" fill="#9df3e4" opacity=".2" filter="url(#glow)"/>
  <path d="M604 66c-8 44 10 70 3 112-6 38 9 60 2 106-4 30 6 52 4 84"
