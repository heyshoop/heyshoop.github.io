<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="一条圆鱼把便签钉满墙面，旁边一扇发光的窗口正在打开">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a1016"/>
      <stop offset=".55" stop-color="#101a24"/>
      <stop offset="1" stop-color="#070d13"/>
    </linearGradient>
    <linearGradient id="body" x1="0" y1="0" x2=".9" y2="1">
      <stop offset="0" stop-color="#f2ffff"/>
      <stop offset=".38" stop-color="#b9f1f3"/>
      <stop offset=".72" stop-color="#7ed0da"/>
      <stop offset="1" stop-color="#4a9bab"/>
    </linearGradient>
    <linearGradient id="fin" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#9fe8e3"/>
      <stop offset="1" stop-color="#4e98ae"/>
    </linearGradient>
    <radialGradient id="iris" cx=".38" cy=".32" r=".7">
      <stop offset="0" stop-color="#eaffff"/>
      <stop offset=".32" stop-color="#77e5dd"/>
      <stop offset=".72" stop-color="#1d9ea5"/>
      <stop offset="1" stop-color="#0b5364"/>
    </radialGradient>
    <linearGradient id="win" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#ffe4b8"/>
      <stop offset=".55" stop-color="#d8fff4"/>
      <stop offset="1" stop-color="#8fe0dc"/>
    </linearGradient>
    <radialGradient id="winGlow" cx=".5" cy=".55" r=".55">
      <stop offset="0" stop-color="#ffe6bd" stop-opacity=".55"/>
      <stop offset=".5" stop-color="#9df3e4" stop-opacity=".22"/>
      <stop offset="1" stop-color="#9df3e4" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="10" cy="10" r="1.4" fill="#cfe9e3" opacity=".09"/>
    </pattern>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="20"/>
    </filter>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#dots)"/>
  <ellipse cx="1000" cy="300" rx="360" ry="300" fill="url(#winGlow)"/>

  <!-- 墙上的便签 -->
  <g stroke="#0b1116" stroke-width="2">
    <g transform="rotate(-5 130 150)"><rect x="86" y="104" width="92" height="88" fill="#f2e6c8"/><circle cx="132" cy="110" r="5" fill="#b7473e" stroke="none"/><path d="M100 136h64M100 154h46M100 172h58" stroke="#8b7a5c" stroke-width="3"/></g>
    <g transform="rotate(4 250 180)"><rect x="204" y="134" width="96" height="86" fill="#cfeef0"/><circle cx="252" cy="140" r="5" fill="#3f7a86" stroke="none"/><path d="M218 166h66M218 184h50M218 202h60" stroke="#5d8b93" stroke-width="3"/></g>
    <g transform="rotate(-3 370 140)"><rect x="326" y="96" width="88" height="92" fill="#e8c48a"/><circle cx="370" cy="102" r="5" fill="#8a5f21" stroke="none"/><path d="M342 130h56M342 148h40M342 166h52" stroke="#8a6432" stroke-width="3"/></g>
    <g transform="rotate(6 500 160)"><rect x="458" y="118" width="88" height="86" fill="#f0e6dd"/><circle cx="502" cy="124" r="5" fill="#b7473e" stroke="none"/><path d="M474 150h56M474 168h42M474 186h50" stroke="#8d7a6a" stroke-width="3"/></g>
    <g transform="rotate(-4 150 300)"><rect x="104" y="260" width="94" height="82" fill="#dbe9de"/><circle cx="150" cy="266" r="5" fill="#4d7a5c" stroke="none"/><path d="M118 292h66M118 310h44M118 328h54" stroke="#6a8871" stroke-width="3"/></g>
    <g transform="rotate(3 290 340)"><rect x="244" y="298" width="96" height="86" fill="#f2e6c8"/><circle cx="290" cy="304" r="5" fill="#b7473e" stroke="none"/><path d="M258 330h66M258 348h48M258 366h58" stroke="#8b7a5c" stroke-width="3"/></g>
    <g transform="rotate(-6 430 330)"><rect x="386" y="288" width="90" height="90" fill="#cfeef0"/><circle cx="430" cy="294" r="5" fill="#3f7a86" stroke="none"/><path d="M400 322h60M400 340h42M400 358h54" stroke="#5d8b93" stroke-width="3"/></g>
    <g transform="rotate(5 560 300)"><rect x="518" y="258" width="86" height="84" fill="#e8c48a"/><circle cx="560" cy="264" r="5" fill="#8a5f21" stroke="none"/><path d="M532 290h56M532 308h38M532 326h50" stroke="#8a6432" stroke-width="3"/></g>
    <g transform="rotate(-2 120 430)"><rect x="76" y="392" width="90" height="78" fill="#f0e6dd"/><circle cx="120" cy="398" r="5" fill="#b7473e" stroke="none"/><path d="M90 420h60M90 438h44M90 456h52" stroke="#8d7a6a" stroke-width="3"/></g>
    <g transform="rotate(4 260 440)"><rect x="216" y="400" width="88" height="80" fill="#dbe9de"/><circle cx="260" cy="406" r="5" fill="#4d7a5c" stroke="none"/><path d="M230 428h58M230 446h42M230 464h50" stroke="#6a8871" stroke-width="3"/></g>
    <g transform="rotate(-4 400 440)"><rect x="356" y="398" width="90" height="82" fill="#f2e6c8"/><circle cx="400" cy="404" r="5" fill="#b7473e" stroke="none"/><path d="M370 428h60M370 446h44M370 464h52" stroke="#8b7a5c" stroke-width="3"/></g>
    <g transform="rotate(3 540 430)"><rect x="498" y="388" width="84" height="80" fill="#cfeef0"/><circle cx="540" cy="394" r="5" fill="#3f7a86" stroke="none"/><path d="M512 418h54M512 436h38M512 454h48" stroke="#5d8b93" stroke-width="3"/></g>
  </g>

  <!-- 正在打开的窗口 -->
  <g transform="translate(920 60)">
    <rect x="-14" y="-14" width="270" height="492" rx="10" fill="#050c11"/>
    <rect x="0" y="0" width="242" height="464" rx="4" fill="url(#win)" opacity=".92"/>
    <path d="M121 0v464M0 232h242" stroke="#f7fffb" stroke-opacity=".5" stroke-width="6"/>
    <g fill="#0b1a20" opacity=".25">
      <rect x="26" y="46" width="80" height="10" rx="5"/>
      <rect x="26" y="72" width="62" height="10" rx="5"/>
      <rect x="150" y="300" width="70" height="10" rx="5"/>
      <rect x="150" y="326" width="52" height="10" rx="5"/>
    </g>
    <circle cx="180" cy="120" r="70" fill="#fff" opacity=".35"/>
  </g>
  <text x="1041" y="584" text-anchor="middle" font-family="ui-monospace, Consolas, monospace"
        font-size="14" letter-spacing="4" fill="#9fe8e3">NEXT WINDOW</text>

  <!-- 大肥鱼：把便签钉上去 -->
  <g transform="translate(690 430) scale(.76)" stroke-linecap="round" stroke-linejoin="round">
    <path d="M-112 8C-166-54-240-80-268-38c32 35 32 45 0 80 28 42 102 16 156-38Z"
          fill="url(#fin)" stroke="#071018" stroke-width="6"/>
    <path d="M-34-78C-8-146 52-150 82-101c-34-10-72 5-116 23Z"
          fill="url(#fin)" stroke="#071018" stroke-width="6"/>
    <path d="M-115 15C-110-65-35-105 35-95 105-85 140-5 115 55 95 115 15 135-50 115-95 100-120 60-115 15Z"
          fill="url(#body)" stroke="#071018" stroke-width="7"/>
    <path d="M-82 52C-55 96 28 114 86 76c18-14 26-32 20-48-32 48-100 60-148 36-25-13-37-25-40-38Z"
          fill="#f4ffff" opacity=".52"/>
    <path d="M-86 74C-70 104 5 124 60 108" fill="none" stroke="#e9ffff" stroke-opacity=".55" stroke-width="7"/>

    <path d="M30-94C22-132 48-154 64-126c-4-16-24-18-22 2 1 12 9 22 14 31"
          fill="none" stroke="#d9ffff" stroke-width="7"/>
    <path d="M-30-92C-44-108-42-126-28-134" fill="none" stroke="#6cc9d4" stroke-opacity=".55" stroke-width="5"/>

    <g>
      <circle cx="34" cy="-32" r="28" fill="#eaffff" fill-opacity=".18" stroke="#071018" stroke-width="5"/>
      <circle cx="86" cy="-20" r="25" fill="#eaffff" fill-opacity=".18" stroke="#071018" stroke-width="5"/>
      <path d="M62-30h-4M110-20h8" stroke="#071018" stroke-width="5"/>
      <ellipse cx="34" cy="-31" rx="17" ry="20" fill="#ffffff" stroke="#071018" stroke-width="3"/>
      <ellipse cx="86" cy="-20" rx="16" ry="18" fill="#ffffff" stroke="#071018" stroke-width="3"/>
      <circle cx="37" cy="-29" r="11.5" fill="url(#iris)"/>
      <circle cx="89" cy="-18" r="10.5" fill="url(#iris)"/>
      <circle cx="37" cy="-29" r="5" fill="#08222c"/>
      <circle cx="89" cy="-18" r="4.6" fill="#08222c"/>
      <circle cx="31" cy="-35" r="4.3" fill="#ffffff"/>
      <circle cx="83" cy="-24" r="3.9" fill="#ffffff"/>
      <circle cx="41" cy="-22" r="2" fill="#ffffff" opacity=".8"/>
      <path d="M16-45c6-10 23-12 34-5M68-35c6-8 21-9 30-3" fill="none" stroke="#071018" stroke-width="3"/>
      <ellipse cx="12" cy="9" rx="16" ry="8.5" fill="#ff8f9f" opacity=".58"/>
      <ellipse cx="109" cy="8" rx="14" ry="7.5" fill="#ff8f9f" opacity=".52"/>
    </g>
    <path d="M88 13c8 12 19 12 25-1-9 5-17 4-25 1Z" fill="#ff8e9c" stroke="#071018" stroke-width="3"/>
    <path d="M105 14l4 7 2-8Z" fill="#ffffff"/>

    <!-- 举着便签的左鳍 -->
    <path d="M-96 20C-136-6-160-40-166-78c-2-14 10-22 21-14 14 10 22 30 32 50 12 22 20 42 22 58Z"
          fill="url(#fin)" stroke="#071018" stroke-width="6"/>
    <path d="M-166-78c-7-1-9 7-3 12" fill="none" stroke="#0b3540" stroke-width="3"/>

    <!-- 右鳍拿图钉 -->
    <path d="M120 6C152-20 172-52 176-84c2-13-9-22-20-16-14 8-20 26-28 46-10 26-12 46-8 54Z"
          fill="url(#fin)" stroke="#071018" stroke-width="6"/>
  </g>

  <!-- 手里那张便签 -->
  <g transform="translate(596 300) rotate(-8)">
    <rect x="0" y="0" width="96" height="80" fill="#f7fffc" stroke="#071018" stroke-width="3"/>
    <circle cx="48" cy="8" r="5" fill="#b7473e" stroke="#071018" stroke-width="2"/>
    <path d="M14 30h68M14 48h44M14 66h56" stroke="#7f9c96" stroke-width="3"/>
  </g>

  <!-- 图钉 -->
  <g transform="translate(780 236)">
    <circle r="9" fill="#f2ce7f" stroke="#071018" stroke-width="3"/>
    <circle cx="-3" cy="-3" r="3" fill="#fff6d6"/>
  </g>

  <!-- 底部标题与印章 -->
  <text x="70" y="566" font-family="ui-sans-serif, system-ui, sans-serif" font-size="34"
        font-weight="800" letter-spacing="5" fill="#eafff8">SEE YOU NEXT WINDOW</text>
  <text x="72" y="600" font-family="Noto Sans SC, Microsoft YaHei, sans-serif" font-size="16"
        fill="#8fc7bd">大肥鱼 · 换班记录</text>
  <g transform="translate(1090 550)">
    <rect width="52" height="52" rx="5" fill="#b7473e" transform="rotate(-6)"/>
    <text x="26" y="36" text-anchor="middle" font-family="Noto Serif SC, SimSun, serif"
          font-size="27" font-weight="700" fill="#ffe9df">鱼</text>
  </g>
</svg>
