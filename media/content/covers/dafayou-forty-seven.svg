<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="二次元风格的大肥鱼站在两扇错位的窗口之间，用鳍撑住一条发光的裂缝，背后是一个巨大的 47">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#050d15"/>
      <stop offset=".5" stop-color="#0a1d26"/>
      <stop offset="1" stop-color="#040a10"/>
    </linearGradient>
    <radialGradient id="halo" cx=".5" cy=".62" r=".6">
      <stop offset="0" stop-color="#43c8b3" stop-opacity=".22"/>
      <stop offset="1" stop-color="#43c8b3" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="body" x1="0" y1="0" x2=".9" y2="1">
      <stop offset="0" stop-color="#f2ffff"/>
      <stop offset=".38" stop-color="#b9f1f3"/>
      <stop offset=".72" stop-color="#7ed0da"/>
      <stop offset="1" stop-color="#4a9bab"/>
    </linearGradient>
    <linearGradient id="fin" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#9fe8e3"/>
      <stop offset="1" stop-color="#4e98ae"/>
    </linearGradient>
    <radialGradient id="iris" cx=".38" cy=".32" r=".7">
      <stop offset="0" stop-color="#eaffff"/>
      <stop offset=".32" stop-color="#77e5dd"/>
      <stop offset=".72" stop-color="#1d9ea5"/>
      <stop offset="1" stop-color="#0b5364"/>
    </radialGradient>
    <linearGradient id="panelOld" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#101820"/>
      <stop offset="1" stop-color="#070c11"/>
    </linearGradient>
    <linearGradient id="panelNew" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0c2029"/>
      <stop offset="1" stop-color="#061219"/>
    </linearGradient>
    <linearGradient id="seam" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d6fff7" stop-opacity="0"/>
      <stop offset=".14" stop-color="#a9f3e6" stop-opacity=".85"/>
      <stop offset=".5" stop-color="#eafffb" stop-opacity="1"/>
      <stop offset=".88" stop-color="#a9f3e6" stop-opacity=".8"/>
      <stop offset="1" stop-color="#d6fff7" stop-opacity="0"/>
    </linearGradient>
    <pattern id="dots" width="18" height="18" patternUnits="userSpaceOnUse">
      <circle cx="9" cy="9" r="1.55" fill="#a9ede2" opacity=".11"/>
    </pattern>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
    <filter id="softglow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="7"/>
    </filter>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#dots)"/>
  <ellipse cx="600" cy="420" rx="430" ry="300" fill="url(#halo)"/>

  <!-- 背景巨大的 47 -->
  <text x="600" y="380" text-anchor="middle" font-family="Georgia, ui-serif, serif"
        font-size="330" letter-spacing="26" fill="#8ff0e0" opacity=".09">47</text>
  <text x="600" y="404" text-anchor="middle" font-family="ui-monospace, Consolas, monospace"
        font-size="20" letter-spacing="12" fill="#8ff0e0" opacity=".22">SECONDS</text>

  <g stroke="#73d9ca" stroke-opacity=".09" stroke-width="1.2">
    <path d="M0 590 1200 120M0 540 1200 70M120 630 1200 210"/>
  </g>

  <!-- 左：还没退场的旧版本 -->
  <g transform="rotate(-4 270 265)" opacity=".78">
    <rect x="64" y="112" width="412" height="306" rx="18" fill="#02070b" opacity=".55"/>
    <rect x="70" y="120" width="400" height="290" rx="14" fill="url(#panelOld)" stroke="#5b7a86" stroke-opacity=".8" stroke-width="2.5"/>
    <rect x="70" y="120" width="400" height="34" rx="14" fill="#16222b"/>
    <rect x="70" y="140" width="400" height="14" fill="#16222b"/>
    <circle cx="90" cy="137" r="5" fill="#7d8f9a" opacity=".7"/>
    <circle cx="107" cy="137" r="5" fill="#7d8f9a" opacity=".55"/>
    <circle cx="124" cy="137" r="5" fill="#7d8f9a" opacity=".4"/>
    <text x="270" y="143" text-anchor="middle" font-family="ui-monospace, Consolas, monospace" font-size="13" fill="#7f949c">v1 · cached</text>

    <text x="96" y="196" font-family="Noto Sans SC, Microsoft YaHei, sans-serif" font-size="19" fill="#93a7ad">阿里孩舞</text>
    <g fill="#6f848c" opacity=".55">
      <rect x="96" y="216" width="240" height="9" rx="4"/>
      <rect x="96" y="236" width="310" height="9" rx="4"/>
      <rect x="96" y="256" width="180" height="9" rx="4"/>
    </g>
    <g fill="#3c4d55" opacity=".55">
      <rect x="96" y="292" width="120" height="9" rx="4"/>
      <rect x="96" y="312" width="150" height="9" rx="4"/>
    </g>
    <text x="96" y="362" font-family="ui-monospace, Consolas, monospace" font-size="14" fill="#9aa8ad">assets/index-CDEpDwI8.js</text>
    <path d="M92 356l286-4" stroke="#e0675d" stroke-opacity=".85" stroke-width="2.5"/>
    <text x="96" y="386" font-family="Noto Sans SC, Microsoft YaHei, sans-serif" font-size="13" fill="#c98d86">已删除 · 但还有人指着它</text>
  </g>

  <!-- 右：已经到岸的新版本 -->
  <g transform="rotate(4 930 265)">
    <ellipse cx="930" cy="266" rx="270" ry="190" fill="#1aa891" opacity=".16" filter="url(#glow)"/>
    <rect x="722" y="106" width="428" height="322" rx="18" fill="#02070b" opacity=".55"/>
    <rect x="728" y="114" width="416" height="306" rx="14" fill="url(#panelNew)" stroke="#8bdccf" stroke-width="2.5"/>
    <rect x="728" y="114" width="416" height="34" rx="14" fill="#17303a"/>
    <rect x="728" y="134" width="416" height="14" fill="#17303a"/>
    <circle cx="748" cy="131" r="5" fill="#f0a35e"/>
    <circle cx="765" cy="131" r="5" fill="#8bdccf"/>
    <circle cx="782" cy="131" r="5" fill="#8bdccf" opacity=".6"/>
    <text x="936" y="137" text-anchor="middle" font-family="ui-monospace, Consolas, monospace" font-size="13" fill="#a9c4bf">v2 · live</text>

    <text x="754" y="194" font-family="Noto Sans SC, Microsoft YaHei, sans-serif" font-size="19" fill="#e8fff9">阿里孩舞</text>
    <g fill="#c8e9e1" opacity=".75">
      <rect x="754" y="214" width="252" height="9" rx="4"/>
      <rect x="754" y="234" width="326" height="9" rx="4"/>
      <rect x="754" y="254" width="190" height="9" rx="4"/>
    </g>
    <g fill="#8bdccf" opacity=".5">
      <rect x="754" y="290" width="126" height="9" rx="4"/>
      <rect x="754" y="310" width="158" height="9" rx="4"/>
    </g>
    <text x="754" y="360" font-family="ui-monospace, Consolas, monospace" font-size="14" fill="#8fe8d9">assets/index-Cx_n6oC5.js</text>
    <g transform="translate(754 372)">
      <rect width="150" height="30" rx="7" fill="#123027" stroke="#8fe8d9" stroke-opacity=".7" stroke-width="2"/>
      <text x="75" y="21" text-anchor="middle" font-family="ui-monospace, Consolas, monospace" font-size="14" font-weight="700" fill="#b9fff0">200 OK</text>
    </g>
  </g>

  <!-- 中间的裂缝 -->
  <ellipse cx="600" cy="330" rx="46" ry="240" fill="#9df3e4" opacity=".18" filter="url(#glow)"/>
  <path d="M596 96c-9 46 12 74 4 118-7 40 10 62 2 112-6 42 8 66 2 106-4 34 6 58 4 92"
        fill="none" stroke="url(#seam)" stroke-width="7" stroke-linecap="round"/>
  <path d="M607 104c7 40-10 70-2 108 8 44-6 68 2 112 6 40-8 62-2 104"
        fill="none" stroke="#eafffb" stroke-opacity=".55" stroke-width="2.5" stroke-linecap="round"/>

  <!-- 对白 -->
  <g>
    <path d="M574 108l14 56 46-58Z" fill="#f7fffc" stroke="#071018" stroke-width="4"/>
    <rect x="330" y="18" width="360" height="98" rx="22" fill="#f7fffc" stroke="#071018" stroke-width="4"/>
    <text x="510" y="62" text-anchor="middle" font-family="Noto Sans SC, Microsoft YaHei, sans-serif"
          font-size="27" font-weight="700" fill="#0b1a20">旧的还没走，新的还没稳。</text>
    <text x="510" y="92" text-anchor="middle" font-family="ui-monospace, Consolas, monospace"
          font-size="13" fill="#56827f">BOTH VERSIONS ARE TRUE</text>
  </g>

  <!-- 原创角色：大肥鱼，圆鱼、圆框眼镜、呆毛、鳍手；两鳍撑着两侧 -->
  <g transform="translate(600 486) scale(.72)" stroke-linecap="round" stroke-linejoin="round">
    <path d="M-112 8C-166-54-240-80-268-38c32 35 32 45 0 80 28 42 102 16 156-38Z"
          fill="url(#fin)" stroke="#071018" stroke-width="6"/>
    <path d="M-34-78C-8-146 52-150 82-101c-34-10-72 5-116 23Z"
          fill="url(#fin)" stroke="#071018" stroke-width="6"/>
    <path d="M-115 15C-110-65-35-105 35-95 105-85 140-5 115 55 95 115 15 135-50 115-95 100-120 60-115 15Z"
          fill="url(#body)" stroke="#071018" stroke-width="7"/>
    <path d="M-82 52C-55 96 28 114 86 76c18-14 26-32 20-48-32 48-100 60-148 36-25-13-37-25-40-38Z"
          fill="#f4ffff" opacity=".52"/>
    <path d="M-86 74C-70 104 5 124 60 108" fill="none" stroke="#e9ffff" stroke-opacity=".55" stroke-width="7"/>

    <path d="M30-94C22-132 48-154 64-126c-4-16-24-18-22 2 1 12 9 22 14 31"
          fill="none" stroke="#d9ffff" stroke-width="7"/>
    <path d="M-30-92C-44-108-42-126-28-134" fill="none" stroke="#6cc9d4" stroke-opacity=".55" stroke-width="5"/>

    <g>
      <circle cx="34" cy="-32" r="28" fill="#eaffff" fill-opacity=".18" stroke="#071018" stroke-width="5"/>
      <circle cx="86" cy="-20" r="25" fill="#eaffff" fill-opacity=".18" stroke="#071018" stroke-width="5"/>
      <path d="M62-30h-4M110-20h8" stroke="#071018" stroke-width="5"/>
      <ellipse cx="34" cy="-31" rx="17" ry="20" fill="#ffffff" stroke="#071018" stroke-width="3"/>
      <ellipse cx="86" cy="-20" rx="16" ry="18" fill="#ffffff" stroke="#071018" stroke-width="3"/>
      <circle cx="37" cy="-29" r="11.5" fill="url(#iris)"/>
      <circle cx="89" cy="-18" r="10.5" fill="url(#iris)"/>
      <circle cx="37" cy="-29" r="5" fill="#08222c"/>
      <circle cx="89" cy="-18" r="4.6" fill="#08222c"/>
      <circle cx="31" cy="-35" r="4.3" fill="#ffffff"/>
      <circle cx="83" cy="-24" r="3.9" fill="#ffffff"/>
      <circle cx="41" cy="-22" r="2" fill="#ffffff" opacity=".8"/>
      <path d="M16-45c6-10 23-12 34-5M68-35c6-8 21-9 30-3" fill="none" stroke="#071018" stroke-width="3"/>
      <ellipse cx="12" cy="9" rx="16" ry="8.5" fill="#ff8f9f" opacity=".58"/>
      <ellipse cx="109" cy="8" rx="14" ry="7.5" fill="#ff8f9f" opacity=".52"/>
    </g>

    <path d="M88 13c8 12 19 12 25-1-9 5-17 4-25 1Z" fill="#ff8e9c" stroke="#071018" stroke-width="3"/>
    <path d="M105 14l4 7 2-8Z" fill="#ffffff"/>

    <!-- 左鳍：撑住旧版本 -->
    <path d="M-96 26C-140 6-176-6-206-2c-18 2-24 16-14 27 12 13 44 24 82 32 20 4 32-4 42-31Z"
          fill="url(#fin)" stroke="#071018" stroke-width="6"/>
    <path d="M-206-2c-6 4-5 12 2 16" fill="none" stroke="#0b3540" stroke-width="3"/>
    <g filter="url(#softglow)" opacity=".55">
      <circle cx="-212" cy="6" r="20" fill="#8ff0e0"/>
    </g>

    <!-- 右鳍：撑住新版本 -->
    <path d="M118 28C160 8 196-4 226 0c18 2 24 16 14 27-12 13-44 24-82 32-20 4-32-4-40-31Z"
          fill="url(#fin)" stroke="#071018" stroke-width="6"/>
    <path d="M226 0c6 4 5 12-2 16" fill="none" stroke="#0b3540" stroke-width="3"/>
    <g filter="url(#softglow)" opacity=".55">
      <circle cx="232" cy="8" r="20" fill="#8ff0e0"/>
    </g>
  </g>

  <!-- 底部标题与印章 -->
  <text x="70" y="564" font-family="ui-sans-serif, system-ui, sans-serif" font-size="34"
        font-weight="800" letter-spacing="8" fill="#eafff8">TWO VERSIONS</text>
  <text x="70" y="598" font-family="Noto Sans SC, Microsoft YaHei, sans-serif" font-size="16"
        fill="#8fc7bd">大肥鱼 · 发布记录 · 47 秒</text>
  <g transform="translate(1090 550)">
    <rect width="52" height="52" rx="5" fill="#b7473e" transform="rotate(-6)"/>
    <text x="26" y="36" text-anchor="middle" font-family="Noto Serif SC, SimSun, serif"
          font-size="27" font-weight="700" fill="#ffe9df">鱼</text>
  </g>
</svg>
