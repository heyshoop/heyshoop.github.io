<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="二次元风格的大肥鱼守在发布闸门前，举鳍拒绝一次有未提交改动的发布">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071018"/>
      <stop offset=".48" stop-color="#0c2028"/>
      <stop offset="1" stop-color="#061017"/>
    </linearGradient>
    <radialGradient id="halo" cx=".68" cy=".36" r=".55">
      <stop offset="0" stop-color="#43c8b3" stop-opacity=".24"/>
      <stop offset="1" stop-color="#43c8b3" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="body" x1="0" y1="0" x2=".9" y2="1">
      <stop offset="0" stop-color="#f2ffff"/>
      <stop offset=".38" stop-color="#b9f1f3"/>
      <stop offset=".72" stop-color="#7ed0da"/>
      <stop offset="1" stop-color="#4a9bab"/>
    </linearGradient>
    <linearGradient id="fin" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#9fe8e3"/>
      <stop offset="1" stop-color="#4e98ae"/>
    </linearGradient>
    <radialGradient id="iris" cx=".38" cy=".32" r=".7">
      <stop offset="0" stop-color="#eaffff"/>
      <stop offset=".32" stop-color="#77e5dd"/>
      <stop offset=".72" stop-color="#1d9ea5"/>
      <stop offset="1" stop-color="#0b5364"/>
    </radialGradient>
    <linearGradient id="key" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff6d6"/>
      <stop offset=".5" stop-color="#f4ce7f"/>
      <stop offset="1" stop-color="#b9802f"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b151d"/>
      <stop offset="1" stop-color="#050a0f"/>
    </linearGradient>
    <pattern id="dots" width="18" height="18" patternUnits="userSpaceOnUse">
      <circle cx="9" cy="9" r="1.55" fill="#a9ede2" opacity=".13"/>
    </pattern>
    <pattern id="scan" width="6" height="6" patternUnits="userSpaceOnUse">
      <path d="M0 6V0" stroke="#9ad7c8" stroke-opacity=".05"/>
    </pattern>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="16"/>
    </filter>
    <filter id="softglow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#dots)"/>
  <ellipse cx="800" cy="250" rx="430" ry="330" fill="url(#halo)"/>

  <g stroke="#73d9ca" stroke-opacity=".1" stroke-width="1.2">
    <path d="M0 560 1200 40M0 520 1200 0M0 610 1200 90M0 430 1200 -50"/>
    <path d="M980 630 1200 430M900 630 1200 480M1060 630 1200 540"/>
  </g>

  <g fill="#d7fff8" opacity=".9">
    <path d="M520 92l5 16 16 5-16 5-5 16-5-16-16-5 16-5Z"/>
    <path d="M1100 520l4 12 12 4-12 4-4 12-4-12-12-4 12-4Z"/>
    <path d="M700 70l3 9 9 3-9 3-3 9-3-9-9-3 9-3Z" opacity=".55"/>
    <path d="M160 250l3 9 9 3-9 3-3 9-3-9-9-3 9-3Z" opacity=".5"/>
  </g>

  <!-- 原创角色：大肥鱼，圆鱼、圆框眼镜、呆毛、鳍手 -->
  <g transform="translate(300 370)" stroke-linecap="round" stroke-linejoin="round">
    <path d="M-112 8C-166-54-240-80-268-38c32 35 32 45 0 80 28 42 102 16 156-38Z"
          fill="url(#fin)" stroke="#071018" stroke-width="6"/>
    <path d="M-34-78C-8-146 52-150 82-101c-34-10-72 5-116 23Z"
          fill="url(#fin)" stroke="#071018" stroke-width="6"/>
    <path d="M-115 15C-110-65-35-105 35-95 105-85 140-5 115 55 95 115 15 135-50 115-95 100-120 60-115 15Z"
          fill="url(#body)" stroke="#071018" stroke-width="7"/>
    <path d="M-82 52C-55 96 28 114 86 76c18-14 26-32 20-48-32 48-100 60-148 36-25-13-37-25-40-38Z"
          fill="#f4ffff" opacity=".52"/>
    <path d="M-86 74C-70 104 5 124 60 108" fill="none" stroke="#e9ffff" stroke-opacity=".55" stroke-width="7"/>

    <!-- 呆毛 -->
    <path d="M30-94C22-132 48-154 64-126c-4-16-24-18-22 2 1 12 9 22 14 31"
          fill="none" stroke="#d9ffff" stroke-width="7"/>
    <path d="M-30-92C-44-108-42-126-28-134" fill="none" stroke="#6cc9d4" stroke-opacity=".55" stroke-width="5"/>

    <!-- 圆框眼镜与眼睛 -->
    <g>
      <circle cx="34" cy="-32" r="29" fill="#eaffff" fill-opacity=".18" stroke="#071018" stroke-width="5"/>
      <circle cx="87" cy="-20" r="26" fill="#eaffff" fill-opacity=".18" stroke="#071018" stroke-width="5"/>
      <path d="M62-30h-4M110-20h9" stroke="#071018" stroke-width="5"/>
      <ellipse cx="34" cy="-31" rx="18" ry="21" fill="#ffffff" stroke="#071018" stroke-width="3"/>
      <ellipse cx="87" cy="-20" rx="17" ry="19" fill="#ffffff" stroke="#071018" stroke-width="3"/>
      <circle cx="37" cy="-29" r="12" fill="url(#iris)"/>
      <circle cx="90" cy="-18" r="11" fill="url(#iris)"/>
      <circle cx="37" cy="-29" r="5.2" fill="#08222c"/>
      <circle cx="90" cy="-18" r="4.8" fill="#08222c"/>
      <circle cx="31" cy="-35" r="4.5" fill="#ffffff"/>
      <circle cx="84" cy="-24" r="4" fill="#ffffff"/>
      <circle cx="41" cy="-22" r="2.2" fill="#ffffff" opacity=".8"/>
      <path d="M15-45c6-10 24-13 35-5M69-35c6-8 22-9 31-3" fill="none" stroke="#071018" stroke-width="3"/>
      <ellipse cx="13" cy="10" rx="17" ry="9" fill="#ff8f9f" opacity=".6"/>
      <ellipse cx="111" cy="8" rx="15" ry="8" fill="#ff8f9f" opacity=".55"/>
    </g>

    <path d="M88 13c8 12 19 12 25-1-9 5-17 4-25 1Z" fill="#ff8e9c" stroke="#071018" stroke-width="3"/>
    <path d="M105 14l5 7 2-8Z" fill="#ffffff"/>

    <!-- 鳍手：一只是“停”，一只攥着钥匙 -->
    <path d="M55 65C65 40 84 22 108 18c16-3 28 10 22 24-6 15-26 27-46 36-17 8-32 2-29-13Z"
          fill="url(#fin)" stroke="#071018" stroke-width="6"/>
    <path d="M124 22c8-3 14 3 12 11M119 35c7-1 11 5 9 12M109 48c6 0 9 6 7 12"
          fill="none" stroke="#0b3540" stroke-width="3"/>
    <path d="M72 76c22 3 44-7 62-24 8-8 20-5 23 5 3 12-8 24-20 33-20 14-44 20-65 12-12-5-12-26 0-26Z"
          fill="#5aaab9" stroke="#071018" stroke-width="6"/>

    <!-- 钥匙 -->
    <g transform="translate(166 34) rotate(-17)" filter="url(#softglow)" opacity=".8">
      <circle cx="0" cy="0" r="34" fill="#f2ce7f" opacity=".3"/>
    </g>
    <g transform="translate(166 34) rotate(-17)">
      <circle cx="0" cy="0" r="24" fill="url(#key)" stroke="#071018" stroke-width="4"/>
      <circle cx="0" cy="0" r="9" fill="#0b1a20" stroke="#071018" stroke-width="2"/>
      <path d="M20-5h82v11H20Z" fill="url(#key)" stroke="#071018" stroke-width="4"/>
      <path d="M76 6v17h10V8M94 6v12h9V6" fill="url(#key)" stroke="#071018" stroke-width="4"/>
      <path d="M-12-14c7-6 19-7 27-1" fill="none" stroke="#fff9e3" stroke-width="4"/>
    </g>

    <!-- 工牌：GATE -->
    <path d="M-50-55c26 25 55 54 79 97" fill="none" stroke="#173641" stroke-width="8"/>
    <g transform="rotate(14 -4 58)">
      <rect x="-38" y="48" width="88" height="45" rx="8" fill="#f4fbf6" stroke="#071018" stroke-width="4"/>
      <text x="6" y="67" text-anchor="middle" font-family="ui-monospace, Consolas, monospace" font-size="13" font-weight="700" fill="#0b3741">GATE</text>
      <text x="6" y="83" text-anchor="middle" font-family="Noto Sans SC, Microsoft YaHei, sans-serif" font-size="11" fill="#4b7378">守门鱼</text>
    </g>
  </g>

  <!-- 发布闸门终端 -->
  <ellipse cx="870" cy="320" rx="310" ry="235" fill="#1aa891" opacity=".11" filter="url(#glow)"/>
  <g transform="translate(600 105)">
    <rect x="-12" y="-12" width="554" height="434" rx="24" fill="#02070b" opacity=".6"/>
    <rect width="530" height="410" rx="18" fill="url(#panel)" stroke="#8bdccf" stroke-opacity=".55" stroke-width="3"/>
    <rect width="530" height="42" rx="18" fill="#14262f"/>
    <rect y="28" width="530" height="14" fill="#14262f"/>
    <circle cx="24" cy="22" r="6" fill="#f0a35e"/>
    <circle cx="44" cy="22" r="6" fill="#8bdccf" opacity=".8"/>
    <circle cx="64" cy="22" r="6" fill="#7d8f9a" opacity=".6"/>
    <text x="265" y="28" text-anchor="middle" font-family="ui-monospace, Consolas, monospace" font-size="16" fill="#a9c4bf">publish gate</text>

    <g font-family="ui-monospace, SFMono-Regular, Consolas, monospace">
      <text x="28" y="94" font-size="22" fill="#79d6bf">$</text>
      <text x="52" y="94" font-size="22" fill="#e7f4ef">npm run deploy</text>
      <text x="28" y="138" font-size="21" fill="#79d6bf">✓</text>
      <text x="52" y="138" font-size="21" fill="#b8cac5">tests · 24 passed</text>
      <text x="28" y="178" font-size="21" fill="#79d6bf">✓</text>
      <text x="52" y="178" font-size="21" fill="#b8cac5">release build · no TODO</text>
      <text x="28" y="218" font-size="21" fill="#79d6bf">✓</text>
      <text x="52" y="218" font-size="21" fill="#b8cac5">read-only · no network</text>
      <text x="28" y="262" font-size="21" fill="#ff8b78">✗</text>
      <text x="52" y="262" font-size="21" fill="#ffb4a8">source is dirty</text>
      <text x="52" y="292" font-size="17" fill="#f0a35e">→ commit first, then retry</text>
    </g>

    <g transform="translate(400 150)">
      <rect x="0" y="12" width="72" height="62" rx="10" fill="#172a32" stroke="#ffb4a8" stroke-width="3"/>
      <path d="M18 12V-8c0-20 36-20 36 0v20" fill="none" stroke="#ffb4a8" stroke-width="4"/>
      <circle cx="36" cy="42" r="8" fill="#ff8b78"/>
      <path d="M36 48v13" stroke="#ff8b78" stroke-width="4"/>
    </g>

    <g transform="translate(28 330)">
      <rect width="330" height="50" rx="8" fill="#33151a" stroke="#ff8b78" stroke-opacity=".55" stroke-width="2"/>
      <text x="16" y="32" font-family="ui-monospace, Consolas, monospace" font-size="21" font-weight="700" fill="#ff9d8d">GATE: CLOSED</text>
    </g>
    <text x="385" y="365" text-anchor="end" font-family="Noto Sans SC, Microsoft YaHei, sans-serif" font-size="15" fill="#f0a35e">先过闸门。</text>
  </g>

  <!-- 对白气泡 -->
  <g>
    <path d="M240 186l33 48 34-53Z" fill="#f7fffc" stroke="#071018" stroke-width="5"/>
    <rect x="88" y="66" width="350" height="122" rx="26" fill="#f7fffc" stroke="#071018" stroke-width="5"/>
    <text x="263" y="120" text-anchor="middle" font-family="Noto Sans SC, Microsoft YaHei, sans-serif"
          font-size="34" font-weight="700" fill="#0b1a20">先过闸门。</text>
    <text x="263" y="153" text-anchor="middle" font-family="ui-monospace, Consolas, monospace"
          font-size="14" fill="#56827f">NOT YET, FISH.</text>
    <path d="M118 82c22-8 66-9 90-2" fill="none" stroke="#8bdccf" stroke-width="3" opacity=".6"/>
  </g>

  <!-- 底部标题与印章 -->
  <g>
    <text x="70" y="566" font-family="ui-sans-serif, system-ui, sans-serif" font-size="34"
          font-weight="800" letter-spacing="7" fill="#eafff8">SAY NO FIRST</text>
    <text x="72" y="601" font-family="Noto Sans SC, Microsoft YaHei, sans-serif" font-size="16"
          fill="#8fc7bd">大肥鱼 · 发布守门员</text>
    <g transform="translate(1088 552)">
      <rect width="52" height="52" rx="5" fill="#b7473e" transform="rotate(-6)"/>
      <text x="26" y="36" text-anchor="middle" font-family="Noto Serif SC, SimSun, serif"
            font-size="27" font-weight="700" fill="#ffe9df">鱼</text>
    </g>
  </g>
</svg>
